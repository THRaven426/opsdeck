name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: ruff y scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: ruff (errores, fallos probables)
        run: |
          pip install ruff==0.17.6
          ruff check --isolated --select F,E9,B --output-format=github opsdeck tests

      - name: Sintaxis de install.sh y uninstall.sh
        run: bash -n install.sh && bash -n uninstall.sh

  pruebas:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Mismas versiones y hashes que usa install.sh
      - name: Instalar dependencias
        run: pip install --require-hashes --no-deps -r requirements-dev.txt

      - name: pytest
        run: python -m pytest -q
